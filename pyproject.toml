[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markforge"
version = "0.1.0"
description = "Универсальный конвертер документов: Markdown ↔ Word ↔ EPUB ↔ HTML ↔ PDF"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fyodor Poplavskiy (Фёдор Поплавский)" }]
keywords = ["markdown", "docx", "epub", "pdf", "converter", "pandoc"]

dependencies = [
    "pydantic>=2",
    "python-docx>=1.1",
    "mammoth>=1.6",
    "markdownify>=0.11",
    "markdown>=3.5",
    "markdown-it-py>=3.0",
    "beautifulsoup4>=4.12",
    "ebooklib>=0.18",
    "pillow>=10",
    "xhtml2pdf>=0.2.11",
]

[project.optional-dependencies]
gui = ["tkinterdnd2>=0.4"]
service = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
all = [
    "tkinterdnd2>=0.4",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
markforge = "markforge.surfaces.cli:main"
markforge-api = "markforge.service.api:run"

[project.gui-scripts]
markforge-gui = "markforge.surfaces.gui:main"

# Точка расширения для сторонних backend'ов (обнаруживаются через entry points).
[project.entry-points."markforge.backends"]

[tool.hatch.build.targets.wheel]
packages = ["markforge"]

[tool.hatch.build.targets.wheel.force-include]
"markforge/assets" = "markforge/assets"

[tool.pytest.ini_options]
testpaths = ["tests"]
